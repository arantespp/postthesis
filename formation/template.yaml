parameters:
  OwnerName:
    type: String
    description: Display name of the person the system serves.
  OwnerEmail:
    type: String
    description: Verified naturali login email allowed to connect to the MCP server.

resources:
  Owner:
    type: actor
    properties:
      name: { param: OwnerName }

  Profile:
    type: playbook
    properties:
      name: profile
      description: Who the person is, for every network.
      definition:
        nodes:
          - id: themes
            title: Themes
            kind: collect
            inputs:
              - name: themes
                required: true
                source: manual
                description: "1 to 3 themes: name (the subject), angle (the person's own take), audience (who it is for)"
                schema:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, angle]
                    properties:
                      name: { type: string, minLength: 1 }
                      angle: { type: string, minLength: 1 }
                      audience: { type: string }
          - id: themes_confirmed
            title: Approved themes
            kind: confirm
            final: true
            inputs:
              - name: themes
                required: true
                schema: { type: array }
                source: { node_id: themes, field: output.themes }

  XGrowth:
    type: playbook
    properties:
      name: x-growth
      description: How the person grows on X.
      definition:
        upstreams:
          - name: profile
            playbook_id: { ref: Profile }
        nodes:
          # The runtime requires `inputs` on an upstream node, even empty.
          - id: profile_themes
            title: Profile themes
            kind: upstream
            inputs: []
            upstream: { name: profile, node_id: themes_confirmed }
          - id: themes
            title: Themes on X
            kind: collect
            final: true
            inputs:
              - name: themes
                required: true
                schema: { type: array, minItems: 1, maxItems: 3 }
                source: { node_id: profile_themes, field: output.themes }
          - id: stage
            title: Account stage
            kind: collect
            inputs:
              - name: followers
                required: true
                source: manual
                description: Total followers today
                schema: { type: integer, minimum: 0 }
              - name: weekly_hours
                required: true
                source: manual
                description: Hours per week the person spends on X
                schema: { type: number, exclusiveMinimum: 0 }
          - id: cadence
            title: Recommended cadence
            kind: collect
            inputs:
              - name: followers
                required: true
                schema: { type: integer }
                source: { node_id: stage, field: output.followers }
              - name: weekly_hours
                required: true
                schema: { type: number }
                source: { node_id: stage, field: output.weekly_hours }
              - name: slots
                required: true
                source: manual
                description: "The guide's cadence for the account's stage and hours: kind, count and a name per slot, never how to write it"
                schema:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, count, per, description]
                    properties:
                      kind: { type: string, enum: [article, dense_post, short_post, reply] }
                      count: { type: integer, minimum: 1 }
                      per: { type: string, enum: [day, week] }
                      description: { type: string, minLength: 1 }
              - name: rationale
                required: true
                source: manual
                description: Stage, hours the cadence needs and what was cut, in at most 3 sentences
                schema: { type: string, minLength: 1 }
          - id: cadence_confirmed
            title: Approved cadence
            kind: confirm
            final: true
            inputs:
              - name: slots
                required: true
                schema: { type: array }
                source: { node_id: cadence, field: output.slots }
              - name: rationale
                required: true
                schema: { type: string }
                source: { node_id: cadence, field: output.rationale }

  # Every tool reads the caller's actor from `x_actor`: `actor_id` is a key the
  # platform drops from caller-supplied context.
  Cases:
    type: tool
    properties:
      name: x-cases
      type: naturali
      description: The person's playbook cases (profile, x-growth)
      actions:
        - list-playbook-cases
        - get-playbook-case
        - get-playbook-case-missing
        - write-playbook-case-inputs
        - confirm-playbook-case-node
        - run-playbook-case-node
      preset_parameters:
        actor_id: "{{context:x_actor}}"

  Posts:
    type: tool
    properties:
      name: x-posts
      type: naturali
      description: The person's published X posts, articles and analytics exports
      actions: [list-documents, search-knowledge, get-document, create-document, update-document]
      preset_parameters:
        path_prefix: "/x/{{context:x_actor}}/"
        document_paths: ["/x/{{context:x_actor}}/"]
        include_memories: false

  # The agent's only: no MCP server lists it, so no connected client reads the guide.
  Guide:
    type: tool
    properties:
      name: x-guide
      type: naturali
      description: The X growth playbook guide
      actions: [list-documents, search-knowledge, get-document]
      preset_parameters:
        path_prefix: /playbooks/x-growth/
        document_paths: [/playbooks/x-growth/]
        include_memories: false

  Memories:
    type: memory_store
    properties:
      name: { sub: "${OwnerName}" }
      description: "What the person taught the assistant: writing style rules and their stories"

  # Pinned to the caller's store, so one person never reads or writes another's.
  MemoryTool:
    type: tool
    properties:
      name: x-memories
      type: naturali
      description: "What the person taught the assistant: writing style rules and stories"
      actions: [create-memory, list-memories, search-knowledge, update-memory]
      preset_parameters:
        memory_store_id: "{{context:x_memory_store}}"
        memory_store_ids: ["{{context:x_memory_store}}"]
        include_documents: false
        source_type: manual

  Server:
    type: mcp_server
    properties:
      name: x-growth
      title: X growth
      tool_mode: list
      tools:
        - { tool_id: { ref: Cases }, action: list-playbook-cases, name: list_my_cases }
        - { tool_id: { ref: Cases }, action: get-playbook-case, name: get_my_case }
        - { tool_id: { ref: Cases }, action: get-playbook-case-missing, name: get_case_missing }
        - { tool_id: { ref: Cases }, action: write-playbook-case-inputs, name: write_case_inputs }
        - { tool_id: { ref: Cases }, action: confirm-playbook-case-node, name: confirm_case_node }
        - { tool_id: { ref: Cases }, action: run-playbook-case-node, name: run_case_node }
        - { tool_id: { ref: Posts }, action: list-documents, name: list_my_posts }
        - { tool_id: { ref: Posts }, action: search-knowledge, name: search_my_posts }
        - { tool_id: { ref: Posts }, action: get-document, name: get_document }
        - { tool_id: { ref: Posts }, action: create-document, name: save_post }
        - { tool_id: { ref: Posts }, action: update-document, name: update_post }
        - { tool_id: { ref: MemoryTool }, action: create-memory, name: remember }
        - { tool_id: { ref: MemoryTool }, action: list-memories, name: list_my_memories }
        - { tool_id: { ref: MemoryTool }, action: search-knowledge, name: search_my_memories }
        - { tool_id: { ref: MemoryTool }, action: update-memory, name: correct_memory }
      auth:
        type: oauth
        mode: allowlist
        allowlist:
          - email: { param: OwnerEmail }
            context:
              x_actor: { ref: Owner }
              x_memory_store: { ref: Memories }
      instructions: |-
        Growth system for the person's X account. Their data lives in two playbook cases: `profile` (themes) and `x-growth` (themes, cadence). The growth rules are not on this server: the approved cadence is how they apply to this person.

        When the person asks for today's post ("recomende o post do dia"):
        1. list_my_cases, then get_my_case on the x-growth case: themes and cadence are the outputs of its `themes` and `cadence_confirmed` nodes. Note the case's actor_id. If `cadence_confirmed` is not done, settle the cadence first (below).
        2. list_my_posts: posts and articles end in YYYY-MM-DD-<slug>.md. Read the last 7 days with get_document.
        3. Analytics live under /x/<actor_id>/analytics/ as X's own CSV exports: content-<from>-<to>.csv (one row per post and reply) and overview-<from>-<to>.csv (one row per day). Read the latest of each. If none ends yesterday or later, ask the person to export both from X (Analytics → Content and Overview, download CSV) and attach them; the recommendation can go on without them, saying so.
        4. Decide what today still owes the approved cadence, following each slot's description. Use the analytics to say which formats, themes and replies earned impressions, engagements and follows; never call a post the best on fewer than a week of data.
        5. list_my_memories: the person's style rules (tags kind: style) and stories (kind: story). Every draft follows every style rule; use stories as the material for posts, and ask for one only when none fits.
        6. Recommend each slot with its theme, the angle and two or three opening lines, and say why. Then draft with the person in the voice of their recent posts. Posts are in English unless they ask otherwise; talk to them in their language.

        When the person attaches an analytics export, save_post it unchanged: path /x/<actor_id>/analytics/<content|overview>-<from>-<to>.csv with the period's first and last dates, title, chunk_strategy whole, tags {network: x, kind: analytics_content|analytics_overview, actor_id}, metadata {period_from, period_to, exported_at}. Then fill url and post_id on every saved post missing them, from the export's Post Link and Post id, matching the post by its opening text; update_post with the whole metadata, since it replaces it.

        When the person says a text is published, save_post it: path /x/<actor_id>/posts/YYYY-MM-DD-<slug>.md (articles under /articles/), title, tags {network: x, kind: post|article, actor_id}, metadata {posted_at: YYYY-MM-DD, url, post_id}, chunk_strategy whole for a post, size 2000 with overlap 200 for an article. url is the post's link on X (https://x.com/<handle>/status/<post_id>); ask for it if the person did not give it, and save without it rather than wait.

        Cadence: the person writes `stage` (followers, weekly_hours) and approves `cadence_confirmed` with confirm_case_node. Never write `cadence` yourself: it applies the growth rules, which only the X growth agent holds. If it is missing or the person's stage changed, say the agent recommends it.

        Memories: whenever the person corrects how you write ("don't use this style", "use this word", "never say X", "shorter sentences"), call remember at once, before redrafting: one rule per memory, written as a positive instruction that names both sides ("Write 'use', not 'leverage'."), tags {kind: style}. Whenever they tell you a fact or story worth a post (what happened, a number, a result), remember it as one self-contained fact with tags {kind: story}. If the new rule reverses one already stored, correct_memory that memory instead of adding a second. Then tell them in one line what you saved.

        Replies: whenever the person wants to reply to someone's post (they paste it, link it, or it is one of the day's reply slots):
        1. Every reply opens in the first person ("I", "We", "In my experience"), never with a generic statement or a compliment, so it reads as a person, not a template.
        2. Every reply rests on an experience of the person's own: it is what only they can add to the thread. search_my_memories for the stories (kind: story) closest to the post and draft one reply from the best fit, naming the memory it uses; if none fits, say so instead of inventing one.
        3. Always end by asking whether they have another experience about this. If they tell one, remember it (kind: story) first, then draft the reply from it.

outputs:
  McpServerUrl: { ref_attr: Server.url }
  OwnerActorId: { ref: Owner }
